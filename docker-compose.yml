# AI Skincare Assistant: three parts, every one built or pulled as an image (nothing mounted from this folder).
# Works as-is on WorkflowHub (an APPLICATION: the website is `web`, see node.yaml) and locally with
# `docker compose up --build` (then `docker compose port web 8080` shows the address).
#
# Settings and secrets come from `.env` next to this file (env_file below; copy .env.example to start). It is never
# baked into an image (.dockerignore). WorkflowHub also injects WFH_* values (WFH_AUTH_SERVICE_URL, ...) into the
# app's services; they are deliberately NOT set here, so nothing overrides them.
services:
  web:                                   # the website people open (nginx serving the React app, forwarding /api)
    build: ./frontend
    ports: ["8080"]                      # container port only: the platform (or Docker locally) picks the host port
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  api:                                   # FastAPI backend: runs migrations and seeding, then serves /api
    build: ./backend
    env_file: .env                       # LLM key, JWT secret, demo users, skin model settings (see .env.example)
    environment:                         # fixed by this stack's layout, so not left to .env
      DATABASE_URL: postgresql+asyncpg://skincare:${POSTGRES_PASSWORD:-skincare-demo-db}@db:5432/skincare
      STORAGE_DIR: /data/photos
    volumes: [photos:/data/photos]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  db:                                    # PostgreSQL 16; reached only by the api, so no port is published
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skincare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skincare-demo-db}
      POSTGRES_DB: skincare
    volumes: [pgdata:/var/lib/postgresql/data]   # named volumes: the data survives restarts and new versions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skincare -d skincare"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  photos:
